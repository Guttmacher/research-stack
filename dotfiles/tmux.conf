# =============================================================================
# GENERAL SETTINGS
# =============================================================================

# Set true color support
set-option -sa terminal-overrides ",xterm*:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# =============================================================================
# PREFIX KEYS
# =============================================================================

# Primary prefix: Ctrl+b
set-option -g prefix C-b
bind-key C-b send-prefix

# Secondary prefix: Ctrl+a (useful for nested tmux sessions - 
# if host uses Ctrl+b, container can use Ctrl+a)
set-option -g prefix2 C-a
bind-key C-a send-prefix

# =============================================================================
# VI MODE CONFIGURATION
# =============================================================================

# Enable vi mode
set-window-option -g mode-keys vi

# Vi-style selection and copying
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy selection behaviors
bind-key -T copy-mode-vi y send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi Y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# VS Code Dev Container clipboard sync via OSC 52
set -s set-clipboard on

# =============================================================================
# MOUSE CONFIGURATION
# =============================================================================

# Enable mouse support
set -g mouse on

# Session menu on click
bind-key -T root MouseDown1StatusRight display-menu -T "#[align=centre]#{session_name}" -x M -y S \
  "Kill Session" k "confirm-before 'kill-session'" \
  "Rename Session" r "command-prompt -I '#S' 'rename-session %%'" \
  "" \
  "New Window at End" w "new-window" \
  "" \
  "New Session" n "new-session" \
  "Switch Session" s "choose-tree -s"

bind-key -T root MouseDown3StatusRight display-menu -T "#[align=centre]#{session_name}" -x M -y S \
  "Kill Session" k "confirm-before 'kill-session'" \
  "Rename Session" r "command-prompt -I '#S' 'rename-session %%'" \
  "" \
  "New Window at End" w "new-window" \
  "" \
  "New Session" n "new-session" \
  "Switch Session" s "choose-tree -s"

# Window menu on right-click (override default)
bind-key -T root MouseDown3Status display-menu -T "#[align=centre]#{window_name}" -x M -y S \
  "Swap Window Left" l "swap-window -t -1" \
  "Swap Window Right" r "swap-window -t +1" \
  "Swap Window Marked" s "swap-window" \
  "" \
  "Kill Window" X "confirm-before 'kill-window'" \
  "Respawn Window" R "confirm-before 'respawn-window -k'" \
  "Mark Window" m "select-window -m" \
  "Rename Window" n "command-prompt -I '#W' 'rename-window %%'" \
  "" \
  "New Window Before" b "new-window -b" \
  "New Window After" w "new-window -a" \
  "New Window at End" W "new-window"

# Mouse toggle keybinding
bind-key m set-option -g mouse \; display-message "Mouse: #{?mouse,ON,OFF}"

# Mouse selection behaviors (stay in copy mode)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-selection-no-clear

# Scroll behavior - line by line instead of multiple lines
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T root WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind-key -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"

# =============================================================================
# WINDOW NAVIGATION
# =============================================================================

# Shift+Alt+vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# =============================================================================
# PANE NAVIGATION & MANAGEMENT
# =============================================================================

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Intuitive pane splitting
bind | split-window -h
bind - split-window -v

# =============================================================================
# SESSION MANAGEMENT
# =============================================================================

# Session switching shortcuts
bind s choose-tree -s          # Show session list
bind S new-session             # Create new session
bind ) switch-client -n        # Next session
bind ( switch-client -p        # Previous session

# =============================================================================
# POPUP SHORTCUTS
# =============================================================================

# Terminal popup (Ctrl+b T)
bind-key T display-popup -E -w 80% -h 80%

# System monitoring popups
bind-key H display-popup -E -w 80% -h 80% "htop"
bind-key G display-popup -E -w 80% -h 80% "glances"

# Development tool popups
bind-key F display-popup -E -w 80% -h 80% "ranger"    # File manager
bind-key V display-popup -E -w 80% -h 80% "vim"       # Vim editor
bind-key L display-popup -E -w 80% -h 80% "lazygit"   # Git interface
bind-key S display-popup -E -w 80% -h 80% "soft"      # Soft tool

# =============================================================================
# STATUS BAR CONFIGURATION
# =============================================================================

# Status bar layout
set-option -g status-right-length 50
set-window-option -g status-right " #S |  #h "
set-window-option -g status-left " "

# Window status format
set-option -g window-status-format '#I:#W#F'
set-option -g window-status-current-format '#I:#W#F'
set-option -g window-status-separator '   '

# =============================================================================
# THEME: SOLARIZED DARK
# =============================================================================
# Reference: https://www.youtube.com/watch?v=DzNmUNvnB04

# Default statusbar colors
set-option -g status-style fg=colour136,bg=colour235 #yellow and base02

# Default window title colors
set-window-option -g window-status-style fg=colour244,bg=default #base0 and default

# Active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default #orange and default

# Pane border colors
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour240 #base01

# Message text colors
set-option -g message-style fg=colour166,bg=colour235 #orange and base02

# Pane number display colors
set-option -g display-panes-active-colour colour33 #orange
set-option -g display-panes-colour colour166 #blue

# Clock color
set-window-option -g clock-mode-colour colour64 #green

# Bell styling
set-window-option -g window-status-bell-style fg=black,bg=red #base02, red

# =============================================================================
# OPTION+NUMBER WINDOW SWITCHING
# =============================================================================

# Map Option+1 through Option+9 to select windows 1-9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

